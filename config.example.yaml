# tagbrr rules: "flagA,flagB,..." -> tag
# Each key is a comma-separated list of flag patterns, matched
# case-insensitively as substrings of the grab's indexer flags (so
# "doubleupload" also catches "G_DoubleUpload"). Any pattern matching
# applies the tag.
#
# The arrs to poll are declared in the environment, not here:
# TAGBRR_ARR_<NAME>_URL + TAGBRR_ARR_<NAME>_KEY per instance.
rules:
  doubleupload: du
  freeleech,halfleech: fl
